.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}

.expert-list{display:grid;gap:8px}

.expert-row .note{grid-column:1/-1;font-size:.88rem;color:var(--muted);font-style:italic}
.bar{height:12px;border-radius:6px;background:var(--accent)}
.barrow{display:grid;grid-template-columns:minmax(140px,260px) 1fr 30px;gap:10px;align-items:center}

.modal{position:fixed;inset:0;background:rgba(10,20,14,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:18px;display:grid;gap:10px;border:1px solid var(--line);max-height:80vh;overflow:auto}

/* projection */
body.proj{font-size:22px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){h1{font-size:1.4rem}.lights .sub{display:none}.mx td.cell{min-width:0}}

/* ======================= CODES DE RÉPONSE =======================
   Le téléphone d'un étudiant fonctionne sans compte et sans réseau : chaque réponse donne un code de 4 caractères
   (étudiant, moment, réponse, clé de contrôle) que l'enseignante saisit dans son espace. */
const ALPHC="ABCDEFGHJKMNPQRSTUVWXYZ23456789", BC=31, MODQ=BC*BC*BC, MULQ=7919, OFFQ=12345;
const INVQ=(()=>{ for(let i=1;i<MODQ;i++) if((MULQ*i)%MODQ===1) return i; return 1; })();
const CODE_KINDS=["accroche","A","B","C","ticket"];
function encodeCode(kIdx, kind, val){
  const n=(kIdx*5+kind)*16+val, x=(n*MULQ+OFFQ)%MODQ;
  const d=[Math.floor(x/(BC*BC)), Math.floor(x/BC)%BC, x%BC];
  const chk=(d[0]+2*d[1]+3*d[2]+kind)%BC;
  return d.map(k=>ALPHC[k]).join("")+ALPHC[chk];
}
function decodeCode(raw){
  const t=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/0/g,"O").replace(/[IL1]/g,"");
  if(t.length!==4) return null;
  const d=[...t].map(ch=>ALPHC.indexOf(ch)); if(d.some(k=>k<0)) return null;
  const x=(d[0]*BC+d[1])*BC+d[2];
  const n=(((x-OFFQ)%MODQ+MODQ)%MODQ*INVQ)%MODQ;
  const val=n%16, kind=Math.floor(n/16)%5, kIdx=Math.floor(n/80);
  if(kIdx>=KEYS.length) return null;
  if((d[0]+2*d[1]+3*d[2]+kind)%BC!==d[3]) return null;
  if(kind>=1&&kind<=3&&val>8) return null;
  if(kind===4&&val>3) return null;
  return {k:KEYS[kIdx], kind, val};
}
const CI={v:0,o:1,r:2}, IC=["v","o","r"];
function myCode(kind){
  const m=S.mine, i=KEYS.indexOf(S.me); if(!m||i<0) return null;
  if(kind===0){ if(!m.v.length) return null; return encodeCode(i,0,m.v.reduce((s,x)=>s|(1<<x),0)); }
  if(kind>=1&&kind<=3){ const f=FOIN_KEYS[kind-1], e=m.e[f], d=m.d[f]; if(!e||!d||!isColor(e.l)||!isColor(d.c)) return null; return encodeCode(i,kind,CI[e.l]*3+CI[d.c]); }
  if(kind===4){ if(!m.k.f||!m.k.e) return null; return encodeCode(i,4,(m.k.f==="refuse"?2:0)+(m.k.e==="refuse"?1:0)); }
  return null;
}
function codeBox(kind, missing){
  const c=myCode(kind);
  return `<div class="card" style="border:2px dashed var(--hay);text-align:center"><div class="eyebrow">Code à donner à Morgane</div>${c?`<div style="font-family:var(--font-mono);font-size:2.4rem;letter-spacing:.18em;font-weight:500">${c}</div><p class="small muted">Dictez-le ou montrez votre écran : vos réponses s'afficheront au tableau.</p>`:`<p class="muted">${esc(missing)}</p>`}</div>`;
}
function applyCode(r){
  const f=r.kind>=1&&r.kind<=3?FOIN_KEYS[r.kind-1]:null;
  teacherEdit(r.k, a=>{
    if(r.kind===0) a.v=[0,1,2,3].filter(i=>r.val&(1<<i));
    else if(f){ a.e[f]=Object.assign({l:"",n:""},a.e[f],{l:IC[Math.floor(r.val/3)]}); a.d[f]=Object.assign({c:"",n:""},a.d[f],{c:IC[r.val%3]}); }
    else if(r.kind===4){ a.k.f=(r.val&2)?"refuse":"garde"; a.k.e=(r.val&1)?"refuse":"garde"; }
  });
  const what = r.kind===0 ? "accroche : "+[0,1,2,3].filter(i=>r.val&(1<<i)).map(i=>ACCROCHE[i].toLowerCase()).join(", ")
    : f ? "foin "+f+" : expert "+LIGHT.expert[IC[Math.floor(r.val/3)]][1].toLowerCase()+", verdict « "+LIGHT.verdict[IC[r.val%3]][1].toLowerCase()+" »"
    : "ticket : foin "+((r.val&2)?"refusé":"gardé")+", enrubanné "+((r.val&1)?"refusé":"gardé");
  return NAME[r.k]+" · "+what;
}

function sanitizeAns(a){
  if(!a||typeof a!=="object") return null;
  const o={t:Number(a.t)||0, s:clip(a.s,40)};
  o.v=Array.isArray(a.v)?a.v.filter(x=>Number.isInteger(x)&&x>=0&&x<ACCROCHE.length).slice(0,4):[];
  o.vw=clip(a.vw,60); o.r=!!a.r;
  o.e={}; o.d={};
  for(const f of FOIN_KEYS){
    const e=a.e&&a.e[f], d=a.d&&a.d[f];
    if(e&&typeof e==="object") o.e[f]={l:isColor(e.l)?e.l:"", n:clip(e.n,100)};
    if(d&&typeof d==="object") o.d[f]={c:isColor(d.c)?d.c:"", n:clip(d.n,120)};
  }
  o.a=[0,1,2,3].map(i=>clip(Array.isArray(a.a)?a.a[i]:"",400));
  const k=a.k||{};
  o.k={f:(k.f==="garde"||k.f==="refuse")?k.f:"", e:(k.e==="garde"||k.e==="refuse")?k.e:"", w:clip(k.w,140)};
  return o;
}
function sanitizeState(s){
  if(!s||typeof s!=="object") return null;
  const st={groupAns:[0,1,2,3].map(i=>clip(Array.isArray(s.groupAns)?s.groupAns[i]:"",600)), step:STEP_IDX[s.step]!=null?s.step:"accueil", corrige:!!s.corrige, revealIns:!!s.revealIns, scribe:KEYS.includes(s.scribe)?s.scribe:"margaux", ticketReveal:!!s.ticketReveal,
    achatQ:Math.min(3,Math.max(0,Number(s.achatQ)||0)), session:clip(s.session||"S1",40), t:Number(s.t)||0, assign:{}};
  for(const k of KEYS){ const a=s.assign&&s.assign[k]; st.assign[k]=(a&&HORSES[a.h]&&EXPERTS[a.e])?{h:a.h,e:a.e}:DEFAULT_ASSIGN[k]; }
  return st;
}
function ansOf(k){
  if(!S.isTeacher && k===S.me && S.mine) return S.mine;
  const a=S.answers[k], p=S.presenceAns[k];
  const ok = x => x && x.s===S.state.session;
  const A=ok(a)?a:null, P=ok(p)?p:null;
  if(!A) return P; if(!P) return A;
  return (P.t>A.t)?P:A;
}

  if(!S.me||!S.mine) return;

const writing={}, pendingW={}, persisted={};
async function writeAnswer(k, data){
  if(!S.db) return;
  if(writing[k]){ pendingW[k]=data; return; }
  writing[k]=true;
  try{ await S.db.doc("answers/"+k).set(JSON.parse(JSON.stringify(data))); if(!S.isTeacher) S.dbWritable=true; }
  catch(e){ if(!S.isTeacher && e && (e.code==="invalid_argument"||e.code==="permission-denied")) S.dbWritable=false; }
  writing[k]=false;
  if(pendingW[k]){ const d=pendingW[k]; delete pendingW[k]; writeAnswer(k,d); }
}
let stateWriting=false, stateNext=null;
async function writeState(st){
  if(!S.db) return;
  if(stateWriting){ stateNext=st; return; }
  stateWriting=true;
  try{ await S.db.doc("live/state").set(JSON.parse(JSON.stringify(st))); }catch(e){}
  stateWriting=false;
  if(stateNext){ const n=stateNext; stateNext=null; writeState(n); }
}
/* Synchronisation entre fenêtres du même navigateur (régie + écran projeté), sans réseau. */
let chan=null; try{ chan=new BroadcastChannel("mesb-trois-bottes"); }catch(e){}
function bcast(){ if(!S.isTeacher) return; const pkt={state:S.state, answers:S.answers}; LS.set("mesb-local", pkt); try{ chan&&chan.postMessage(pkt); }catch(e){} }
function receiveLocal(pkt){
  if(!pkt||typeof pkt!=="object") return;
  if(pkt.req){ if(S.isTeacher&&!S.proj&&S.route!=="projection") bcast(); return; }
  if(pkt.state) receiveState(pkt.state);
  if(pkt.answers&&typeof pkt.answers==="object"){ for(const k of KEYS){ const a=sanitizeAns(pkt.answers[k]); if(a&&(!S.answers[k]||a.t>(S.answers[k].t||0))) S.answers[k]=a; } }
  render();
}

let stTimer=null;
function setState(patch, debounce){
  if(!S.isTeacher) return;
  S.state=Object.assign({}, S.state, patch, {t:Date.now()});
  S.stateKnown=true;
  bcast();
  clearTimeout(stTimer);
  const push=()=>{ writeState(S.state); if(S.room) S.room.emit("state", S.state).catch(()=>{}); };
  if(debounce) stTimer=setTimeout(push,700); else push();
  render();
}
/* Saisie par l'enseignante des réponses données à l'oral ou avec les cartons. */
function teacherEdit(k, fn){
  if(!S.isTeacher||!KEYS.includes(k)) return;
  const a=sanitizeAns(JSON.parse(JSON.stringify(ansOf(k)||emptyAns())))||emptyAns();
  fn(a); a.t=Date.now(); a.s=S.state.session;
  S.answers[k]=a; S.presenceAns[k]=null;
  writeAnswer(k,a); bcast(); render();
}
function receiveState(st){
  const s=sanitizeState(st); if(!s) return;
  if(s.t < (S.state.t||0) && S.stateKnown) return;
  const sessionChanged = s.session!==S.state.session;
  S.state=s; S.stateKnown=true; S.autonome=false;
  if(sessionChanged && S.me && !S.isTeacher){ S.mine=emptyAns(); LS.set("mesb-ans-"+S.me,S.mine); if(S.room) S.room.presence({role:"etudiant",key:S.me,ans:S.mine}).catch(()=>{}); }
  render();
}
function handlePeers(peers){
  S.peers=peers||[];
  for(const p of S.peers){
    const pr=p.presence||{};
    if(pr.role!=="etudiant"||!KEYS.includes(pr.key)||p.isMe) continue;
    const a=sanitizeAns(pr.ans); if(!a) continue;
    const prev=S.presenceAns[pr.key];
    if(!prev || a.t>=prev.t) S.presenceAns[pr.key]=a;
    if(S.isTeacher && S.db && a.s===S.state.session){
      const dbA=S.answers[pr.key];
      if((!dbA || a.t>(dbA.t||0)) && persisted[pr.key]!==a.t){ persisted[pr.key]=a.t; writeAnswer(pr.key, a); }
    }
  }
  render();
}

async function boot(){
  S.me = LS.get("mesb-me");
  if(S.me && !KEYS.includes(S.me)) S.me=null;
  S.route = location.hash.replace("#","");
  { const st=LS.get("mesb-step"); if(st&&STEP_IDX[st]!=null) S.state.step=st; }
  if(S.me) loadMine();
  { const pkt=LS.get("mesb-local"); if(pkt&&pkt.state){ const st=sanitizeState(pkt.state); if(st){ S.state=st; S.stateKnown=true; } if(pkt.answers) for(const k of KEYS){ const a=sanitizeAns(pkt.answers[k]); if(a) S.answers[k]=a; } } }
  try{ chan&&chan.postMessage({req:1}); }catch(e){}
  render();
  let db=null, room=null, user=null;
  if(window.firebase && FIREBASE_CONFIG.apiKey){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      const auth=firebase.auth();
      const u=await new Promise(res=>{ const off=auth.onAuthStateChanged(x=>{ off(); res(x); }); });
      if(!u) await auth.signInAnonymously();
      S.isTeacher = isTeacherUser(auth.currentUser);
      db=firebase.firestore();
    }catch(e){ console.error(e); S.fbErr=String(e&&e.message||e); }
  } else S.fbErr="config";
  S.db=db; S.room=room; S.user=user;

  if(S.me && !S.isTeacher) loadMine();
  const stateTimer=null;
  if(db){
    db.doc("live/state").onSnapshot(snap=>{
      clearTimeout(stateTimer);
      if(!snap.metadata.fromCache) S.dbLive=true;
      if(snap.exists) receiveState(snap.data());
      else { S.stateKnown=true; render(); }
    }, ()=>{ S.dbLive=false; render(); });
    db.collection("answers").onSnapshot(snap=>{
      const m={};
      for(const d of snap.docs){ if(KEYS.includes(d.id)){ const a=sanitizeAns(d.data()); if(a) m[d.id]=a; } }
      for(const k of KEYS){ if(m[k]&&(!S.answers[k]||m[k].t>=(S.answers[k].t||0))) S.answers[k]=m[k]; }
      if(!S.isTeacher && S.me && m[S.me] && m[S.me].s===S.state.session && (!S.mine || m[S.me].t>S.mine.t)){ S.mine=m[S.me]; LS.set("mesb-ans-"+S.me,S.mine); }
      render();
    }, ()=>{});
  }
  if(room){
    room.onConnection(c=>{ S.roomLive=c; render(); }, ()=>{ S.roomLive=false; render(); });
    room.on("state", msg=>{ if(!msg.isMe) receiveState(msg.data); }, ()=>{});
    room.onPeers(ch=>{
      handlePeers(ch.peers);
      if(S.isTeacher && ch.joined && ch.joined.some(p=>!p.isMe) && S.stateKnown) room.emit("state", S.state).catch(()=>{});
    }, ()=>{});
    if(S.isTeacher) room.presence({role:"prof"}).catch(()=>{});
    else if(S.me) room.presence({role:"etudiant", key:S.me, ans:S.mine}).catch(()=>{});
  }
  render();
}

let pendingRender=false;
function render(){
  const ae=document.activeElement;
  if(ae && (ae.tagName==="TEXTAREA"||(ae.tagName==="INPUT"&&(ae.type==="text"||ae.type==="password"))) && document.getElementById("app").contains(ae)){ pendingRender=true; return; }
  pendingRender=false;
  let r=S.route;
  if(S.proj) r="projection";
  if(!r) r = S.isTeacher ? "prof" : "etudiant";
  document.body.classList.toggle("proj", r==="projection");
  document.body.classList.toggle("has-drawer", r==="projection" && S.isTeacher && !!S.drawer);
  const y=window.scrollY;
  document.getElementById("app").innerHTML = r==="prof" ? teacherView() : r==="projection" ? projView() : studentView();
  window.scrollTo(0,y);
  const qr=document.getElementById("qr");
  if(qr && !qr.hasChildNodes() && window.QRCode){ try{ new QRCode(qr,{text:location.origin+location.pathname,width:220,height:220,correctLevel:QRCode.CorrectLevel.M}); }catch(e){} }
}
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(pendingRender) render(); }, 50); });

function openGloss(g){
  const G=GLOSS[g]; if(!G) return;
  document.getElementById("modal-title").textContent=G[0];
  document.getElementById("modal-body").innerHTML=`<p>${esc(G[1])}</p>${seuilsHtml(g)}`;
  document.getElementById("modal").classList.add("open");
  document.getElementById("modal-close").focus();
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); }

document.addEventListener("click", ev=>{
  const b=ev.target.closest("[data-action]");
  if(!b){ if(ev.target.id==="modal") closeModal(); return; }
  const a=b.dataset.action;
  const m=S.mine;
  switch(a){
    case "gloss": openGloss(b.dataset.g); break;
    case "close-modal": closeModal(); break;
    case "tab": S.tab=b.dataset.tab; render(); window.scrollTo(0,0); break;
    case "pick": S.me=b.dataset.k; LS.set("mesb-me",S.me); loadMine(); if(S.room) S.room.presence({role:"etudiant",key:S.me,ans:S.mine}).catch(()=>{}); S.route="etudiant"; render(); break;
    case "change-me": S.me=null; LS.del("mesb-me"); if(S.room) S.room.presence({role:null,key:null,ans:null}).catch(()=>{}); render(); break;
    case "route": S.route=b.dataset.r; try{ location.hash=b.dataset.r; }catch(e){} render(); break;
    case "vote": { const i=+b.dataset.i; m.v=m.v.includes(i)?m.v.filter(x=>x!==i):m.v.concat(i).sort(); saveMine(); render(); break; }
    case "ready": m.r=!m.r; saveMine(); render(); break;
    case "expert": { const f=currentFoin(); if(!f) break; m.e[f]=Object.assign({l:"",n:""},m.e[f],{l:b.dataset.c}); saveMine(); render(); break; }
    case "verdict": { const f=currentFoin(); if(!f) break; m.d[f]=Object.assign({c:"",n:""},m.d[f],{c:b.dataset.c}); saveMine(); render(); break; }
    case "ticket": m.k[b.dataset.q]=b.dataset.x; saveMine(); render(); break;
    case "auto-step": if(S.autonome){ S.state=Object.assign({},S.state,{step:b.dataset.step}); LS.set("mesb-step",b.dataset.step); render(); window.scrollTo(0,0); } break;
    case "prev": if(stepIdx()>0) setState({step:STEPS[stepIdx()-1].id}); break;
    case "next": if(stepIdx()<STEPS.length-1) setState({step:STEPS[stepIdx()+1].id}); break;
    case "goto": setState({step:b.dataset.step}); break;
    case "corrige": setState({corrige:!S.state.corrige}); break;
    case "achatq": setState({achatQ:+b.dataset.q}); break;
    case "reveal-ins": setState({revealIns:!S.state.revealIns}); break;
    case "ticket-reveal": setState({ticketReveal:!S.state.ticketReveal}); break;
    case "proj": S.proj=true; render(); window.scrollTo(0,0); break;
    case "unproj": S.proj=false; if(S.route==="projection"){ S.route="prof"; try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} } if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); } render(); break;
    case "fullscreen": try{ const p=document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} break;
    case "reset": S.confirmReset=true; render(); break;
    case "drawer": S.drawer=!S.drawer; render(); break;
    case "tedit": { const k=b.dataset.k, fld=b.dataset.field, c=b.dataset.c, f=currentFoin();
      teacherEdit(k, a=>{
        if(fld==="v"){ const i=+c; a.v=a.v.includes(i)?a.v.filter(x=>x!==i):a.v.concat(i).sort(); }
        else if(fld==="el"&&f){ const cur=(a.e[f]||{}).l; a.e[f]=Object.assign({l:"",n:""},a.e[f],{l:cur===c?"":c}); }
        else if(fld==="dc"&&f){ const cur=(a.d[f]||{}).c; a.d[f]=Object.assign({c:"",n:""},a.d[f],{c:cur===c?"":c}); }
        else if(fld==="kf"||fld==="ke"){ const q=fld[1]; a.k[q]=a.k[q]===c?"":c; }
      }); break; }
    case "logout": (async()=>{ try{ await firebase.auth().signOut(); await firebase.auth().signInAnonymously(); }catch(e){} S.isTeacher=false; S.proj=false; S.route="etudiant"; render(); })(); break;
    case "glogin": teacherLogin(); break;
    case "reset-no": S.confirmReset=false; render(); break;
    case "reset-yes": doReset(); break;
  }
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.dataset.action==="scribe"){ setState({scribe:el.value}); return; }
  if(el.dataset.action==="assign"){
    const k=el.dataset.k, kind=el.dataset.kind, val=el.value;
    const asg={}; for(const x of KEYS) asg[x]=Object.assign({},assignOf(x));
    const other=KEYS.find(x=>x!==k && asg[x][kind]===val);
    if(other) asg[other][kind]=asg[k][kind];
    asg[k][kind]=val;
    setState({assign:asg});
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.dataset.gfield!=null && S.isTeacher){ const g=(S.state.groupAns||["","","",""]).slice(); g[+el.dataset.gfield]=clip(el.value,600); setState({groupAns:g}, true); return; }
  const fld=el.dataset.field; if(!fld) return;
  if(fld==="lex"){ S.lexq=el.value; const l=document.getElementById("lex-list"); if(l) l.innerHTML=lexItems(); return; }
  const m=S.mine; if(!m) return; const f=currentFoin();
  if(fld==="vw") m.vw=clip(el.value,60);
  else if(fld==="en"&&f) m.e[f]=Object.assign({l:"",n:""},m.e[f],{n:clip(el.value,100)});
  else if(fld==="dn"&&f) m.d[f]=Object.assign({c:"",n:""},m.d[f],{n:clip(el.value,120)});
  else if(fld==="kw") m.k.w=clip(el.value,140);
  else if(/^a[0-3]$/.test(fld)) m.a[+fld[1]]=clip(el.value,400);
  saveMine(true);
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape"){ if(document.getElementById("modal").classList.contains("open")) closeModal(); else if(S.proj){ S.proj=false; render(); } return; }
  if(S.proj && S.isTeacher && !/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)){
    if(ev.key==="ArrowRight"&&stepIdx()<STEPS.length-1) setState({step:STEPS[stepIdx()+1].id});
    if(ev.key==="ArrowLeft"&&stepIdx()>0) setState({step:STEPS[stepIdx()-1].id});
  }
});
window.addEventListener("hashchange", ()=>{ S.route=location.hash.replace("#",""); render(); });

async function doReset(){
  S.confirmReset=false;
  const session="S"+Date.now();
  if(S.db){ for(const k of KEYS){ try{ await S.db.doc("answers/"+k).delete(); }catch(e){} } }
  S.answers={}; S.presenceAns={};
  setState({groupAns:["","","",""]});
  setState({session, step:"accueil", corrige:false, revealIns:false, ticketReveal:false, achatQ:0});
}

boot();
</script>
</body>
