<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le tube digestif du cheval · UniLaSalle Rouen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Aux couleurs d'UniLaSalle Rouen (masque 2024) : violet #A14593, noir #231F20, gris clair #F3F4F4, police Nunito ;
   titres en capitales condensées (Barlow Condensed, proche de la Diazo du masque). Une seule ambiance claire, comme les supports de l'école.
   Les feux vert / orange / rouge restent réservés aux verdicts des simulations. */
:root{
  --paper:#F3F4F4; --surface:#ffffff; --ink:#231F20; --muted:#5d5759; --line:#dcdcde;
  --accent:#A14593; --accent-ink:#ffffff; --accent-dark:#7e3373; --accent-soft:#f4e6f1;
  --hay:#A14593; --hay-soft:#f4e6f1;
  --ok:#2b7a4b; --ok-soft:#dff0e5; --warn:#b86a00; --warn-soft:#fbe9cc; --bad:#b83226; --bad-soft:#f8dcd8;
  --stom:#d08a2e; --si:#4f86a8; --li:#5c9a5f; --mouth:#A14593;
  --font-display:"Barlow Condensed","Arial Narrow","Nunito",sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em} h2{font-size:1.55rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em} h3{font-family:var(--font-body);font-size:1.05rem;font-weight:800}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:4px}
.manager{border-left:5px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* barre du haut et onglets */
.top{position:relative;background:var(--accent);color:#fff;overflow:hidden}
.top::before{content:"";position:absolute;right:-40px;bottom:-50px;transform:scaleX(-1);width:150px;height:120px;border-left:34px solid rgba(255,255,255,.12);border-bottom:34px solid rgba(255,255,255,.12);border-bottom-left-radius:34px}
.top .in{position:relative;max-width:900px;margin:0 auto;padding:18px 16px 16px;display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.top .t1{font-family:var(--font-display);font-weight:800;font-size:1.7rem;text-transform:uppercase;line-height:1}
.top .t2{font-size:.9rem;opacity:.9;font-weight:700}
.top img{height:44px;width:auto;display:block}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;padding:11px 4px;font-size:.82rem;font-weight:700;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
/* le parcours */
.tract{display:flex;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tract button{border:0;color:#fff;font-weight:700;font-size:.82rem;padding:0 6px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;opacity:.82}
.tract button[aria-pressed="true"]{opacity:1;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35)}
.organs{display:flex;gap:6px;flex-wrap:wrap}
.organs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem}
.organs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.fact{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}
.fact .k{font-weight:900;color:var(--accent);white-space:nowrap}
@media (max-width:560px){.fact{grid-template-columns:1fr;gap:0}.fact .k{white-space:normal}}
/* simulations */
.sim label{font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=number]{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px}
.out{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile .l{font-size:.82rem;color:var(--muted)}
.verdict{border-radius:8px;padding:10px 14px;font-weight:600;border:1.5px solid}
.verdict.v{color:var(--ok);background:var(--ok-soft)} .verdict.o{color:var(--warn);background:var(--warn-soft)} .verdict.r{color:var(--bad);background:var(--bad-soft)}
.verdict span{color:var(--ink);font-weight:400}
.day{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.day .h{display:grid;gap:2px}
.day button{border:1px solid var(--line);background:var(--paper);height:30px;border-radius:4px;padding:0;font-size:.7rem}
.day button.hay{background:var(--li);border-color:var(--li);color:#fff}
.day button.conc{background:var(--stom);border-color:var(--stom);color:#fff;font-weight:700}
.day button.conc.hay{background:linear-gradient(180deg,var(--li) 0 50%,var(--stom) 50% 100%);border-color:var(--stom)}
.day .ph{height:10px;border-radius:3px}
.day .lbl{font-size:.62rem;color:var(--muted);text-align:center;font-family:var(--font-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.gauge{position:relative;height:18px;border-radius:9px;background:linear-gradient(90deg,var(--ok) 0 25%,var(--warn) 25% 50%,var(--bad) 50% 100%)}
.gauge .needle{position:absolute;top:-6px;width:4px;height:30px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.gauge-l{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-family:var(--font-mono)}
/* quiz */
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-weight:600}
.opt.good{border-color:var(--ok);background:var(--ok-soft)} .opt.badc{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden} .prog i{display:block;height:100%;background:var(--accent)}
/* cartes */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.flip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;min-height:140px;display:grid;gap:8px;align-content:start}
.flip.front{background:var(--accent);color:#fff;border-color:var(--accent);align-content:center;justify-items:center;text-align:center}
.flip.front h3{font-size:1.3rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){h1{font-size:1.45rem}.day button{height:26px}.day .lbl{font-size:.55rem}}
</style>
</head>

  {q:"Un cheval passe à un aliment beaucoup plus riche en céréales. Son intestin s'adapte…", o:["Lentement (environ 2 mois) et de façon limitée","En 2 jours","Jamais","Immédiatement"], a:0, x:"Les enzymes de l'amidon augmentent lentement et restent faibles. D'où les transitions alimentaires progressives."},
  {q:"Pour donner plus d'énergie à un cheval de sport, quelle source le cheval digère-t-il bien ?", o:["L'huile, après une adaptation progressive de 3 à 4 semaines","Le sucre en morceaux","Une grande quantité d'orge en un seul repas","Le pain"], a:0, x:"Le cheval digère bien les graisses. L'huile apporte de l'énergie sans le risque de l'amidon en excès."},
  {q:"Quels signes peuvent indiquer un problème dentaire ?", o:["Le cheval recrache des boulettes, du grain entier dans le crottin, des défenses au mors","Un poil brillant","Un cheval qui boit beaucoup","Un cheval qui se roule"], a:0, x:"Les dents poussent toute la vie et s'usent de façon irrégulière : un suivi dentaire régulier est nécessaire."},
  {q:"Un cheval laisse ses granulés minéraux au fond de sa mangeoire. Pourquoi est-ce possible ?", o:["Ses lèvres très mobiles lui permettent de trier précisément","Il ne les voit pas","Il n'a pas assez faim","C'est un signe de maladie grave"], a:0, x:"Le cheval trie au toucher et à l'odeur. Les granulés minéraux peu appétents sont souvent mis de côté."},
  {q:"On introduit un nouvel aromatisant dans la ration. Combien de temps faut-il pour juger s'il plaît ?", o:["Au moins une semaine d'adaptation","Un repas suffit","Une heure","Un mois minimum"], a:0, x:"Les chevaux ont besoin d'au moins une semaine pour s'habituer à une nouvelle saveur."},
  {q:"Quelle part du tube digestif représente le gros intestin chez le cheval ?", o:["Plus de 60 %","Environ 10 %","Environ 30 %","Environ 90 %"], a:0, x:"Contre environ 9 % pour l'estomac et 30 % pour l'intestin grêle."},
  {q:"Pourquoi le cheval n'a-t-il pas de vésicule biliaire ?", o:["Il est fait pour manger en continu : la bile coule en permanence","Il ne digère pas les graisses","C'est une maladie fréquente","Elle est remplacée par l'estomac"], a:0, x:"Chez les espèces qui font de gros repas, la vésicule stocke la bile. Le cheval, lui, mange par petites quantités toute la journée."}
];

const $=id=>document.getElementById(id);

const fr=(v,d=0)=>Number(v).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- Simulation 1 : mâcher ---------- */
function simMast(){
  const f=S.mast.foin, c=S.mast.conc;
  const min=f*40+c*10, coups=f*3500+c*1000;
  const hh=Math.floor(min/60), mm=Math.round(min%60);
  const pctFoin=min? Math.round(f*40/min*100):0;
  let vd, cls;
  if(f<4){ cls="r"; vd="Très peu de fourrage : le cheval mâche peu, salive peu et reste longtemps l'estomac vide."; }
  else if(min<360){ cls="o"; vd="Le cheval passe moins de 6 heures à mâcher : il risque de s'ennuyer (tics, bois rongé) et son estomac est moins protégé."; }
  else { cls="v"; vd="Le cheval passe de longues heures à mâcher : il salive beaucoup, son estomac est protégé et il est occupé."; }
  return `<div class="card sim"><div class="eyebrow">Simulation 1</div><h2>Mâcher, c'est protéger</h2>
    <p class="muted">Réglez la ration quotidienne d'un cheval (en kg de matière sèche) et regardez combien de temps il passe à mâcher.</p>
    <label for="r-foin">Foin : <span class="num">${fr(f)} kg</span> par jour</label><input type="range" id="r-foin" min="0" max="15" step="1" value="${f}" data-mast="foin">
    <label for="r-conc">Granulés ou céréales : <span class="num">${fr(c)} kg</span> par jour</label><input type="range" id="r-conc" min="0" max="8" step="0.5" value="${c}" data-mast="conc">
    <div class="out">
      <div class="tile"><div class="v">${hh} h ${String(mm).padStart(2,"0")}</div><div class="l">de mastication par jour</div></div>
      <div class="tile"><div class="v">${fr(coups)}</div><div class="l">coups de mâchoire</div></div>
      <div class="tile"><div class="v">${pctFoin} %</div><div class="l">du temps de mastication vient du foin</div></div>
    </div>
    <div class="verdict ${cls}">${cls==="v"?"✓":cls==="o"?"!":"✕"} ${esc(vd)}</div>
    <p class="small muted">Repères du cours : 1 kg de MS de foin = 40 min et 3 000 à 4 000 coups de mâchoire ; 1 kg de MS de granulés = 10 min et 1 000 coups. La salive n'est produite que pendant la mastication.</p></div>`;
}

/* ---------- Simulation 2 : la journée de l'estomac ---------- */
function dayStats(){
  const d=S.day; let maxGap=0, gapStart=-1;
  if(d.every(x=>!x.hay)) maxGap=24;
  else { for(let s=0;s<24;s++){ if(d[s].hay) continue; if(d[(s+23)%24].hay){ let n=0; while(!d[(s+n)%24].hay&&n<24) n++; if(n>maxGap){maxGap=n;gapStart=s;} } } }
  const concNoHay=d.map((x,h)=>x.conc&&!x.hay&&!d[(h+23)%24].hay?h:null).filter(x=>x!==null);
  const nConc=d.filter(x=>x.conc).length, nHay=d.filter(x=>x.hay).length;
  /* zone de pH estimée heure par heure : foin dans l'heure ou l'heure précédente = protégé ; sinon exposé */
  const ph=d.map((x,h)=>{ if(x.hay) return "v"; if(d[(h+23)%24].hay) return "v"; let k=0; while(k<24&&!d[(h-k+24)%24].hay) k++; return k>=4?"r":"o"; });
  return {maxGap,gapStart,concNoHay,nConc,nHay,ph};
}
function simJournee(){
  const st=dayStats(), d=S.day;
  let cls="v", msg="Le fourrage est bien réparti : l'estomac reste protégé toute la journée.";
  const pb=[];
  if(st.maxGap>4) pb.push(`la plus longue période sans fourrage dure ${st.maxGap} h (repère : 3 à 4 h au maximum)`);
  if(st.concNoHay.length) pb.push(`${st.concNoHay.length>1?"des repas":"un repas"} de granulés sans foin juste avant (${st.concNoHay.map(h=>h+" h").join(", ")}) : ils tombent dans l'acide`);
  if(pb.length){ cls=(st.maxGap>8||st.concNoHay.length>1)?"r":"o"; msg="Attention : "+pb.join(" ; ")+"."; }
  const cells=d.map((x,h)=>`<div class="h"><button class="${(x.hay?"hay ":"")+(x.conc?"conc":"")}" data-hour="${h}" aria-label="${h} h : ${x.hay?"foin":"pas de foin"}${x.conc?", granulés":""}" title="${h} h">${x.conc?"G":""}</button><div class="ph" style="background:var(--${st.ph[h]==="v"?"ok":st.ph[h]==="o"?"warn":"bad"})"></div><div class="lbl">${h%3===0?h:""}</div></div>`).join("");
  return `<div class="card sim"><div class="eyebrow">Simulation 2</div><h2>La journée de l'estomac</h2>
    <p class="muted">Organisez la journée d'un cheval au box. Choisissez un outil, puis touchez les heures : la ligne de couleur sous chaque heure montre si la partie fragile de l'estomac est protégée.</p>
    <div class="row"><button class="btn" data-tool="hay" aria-pressed="${S.tool!=="conc"}">Foin disponible</button><button class="btn" data-tool="conc" aria-pressed="${S.tool==="conc"}">Repas de granulés</button>
      <span class="spacer" style="flex:1"></span><button class="btn" data-preset="box">Box classique</button><button class="btn" data-preset="ideal">Foin à volonté</button><button class="btn" data-preset="clear">Tout effacer</button></div>
    <div class="day">${cells}</div>
    <div class="legend"><span><i class="sw" style="background:var(--li)"></i>foin disponible</span><span><i class="sw" style="background:var(--stom)"></i>G = repas de granulés (moitié verte : avec du foin)</span><span><i class="sw" style="background:var(--ok)"></i>estomac protégé (pH 5 à 7)</span><span><i class="sw" style="background:var(--warn)"></i>protection qui baisse</span><span><i class="sw" style="background:var(--bad)"></i>exposé à l'acide (pH 3 à 4)</span></div>
    <div class="out">
      <div class="tile"><div class="v">${st.maxGap} h</div><div class="l">plus longue période sans fourrage</div></div>
      <div class="tile"><div class="v">${st.nHay} h</div><div class="l">avec du foin disponible</div></div>
      <div class="tile"><div class="v">${st.nConc}</div><div class="l">repas de granulés</div></div>
    </div>
    <div class="verdict ${cls}">${cls==="v"?"✓":cls==="o"?"!":"✕"} ${esc(msg)}</div>
    <p class="small muted">Modèle simplifié pour la révision : on considère l'estomac protégé pendant l'heure où le foin est disponible et l'heure suivante. Repères du cours : avec du foin, la zone haute de l'estomac reste vers pH 5 à 7 ; sans foin, elle descend vers pH 3 à 4.</p></div>`;
}

/* ---------- Simulation 3 : l'amidon par repas ---------- */
const FEEDS={orge:["Orge",52],avoine:["Avoine",40],mais:["Maïs",65],floc:["Aliment floconné (exemple)",30],gran:["Granulé sport (exemple)",25],fibre:["Aliment riche en fibres (exemple)",10],perso:["Mon aliment (lire l'étiquette)",null]};
function simAmidon(){
  const a=S.amid, pct=a.feed==="perso"?a.pct:FEEDS[a.feed][1];
  const gMeal=a.kg*1000*pct/100, per100=gMeal/(a.pv/100);
  const need=Math.max(1,Math.ceil(per100/100));
  const pos=Math.min(100,per100/400*100);
  let cls, msg;
  if(per100<=100){ cls="v"; msg="Le repas respecte le repère du cours : l'amidon peut être digéré avant d'arriver dans le gros intestin."; }
  else if(per100<=200){ cls="o"; msg=`Au-delà du repère du cours. Une partie de l'amidon risque d'arriver dans le gros intestin. Répartir la même quantité en ${need} repas ramènerait chaque repas sous le repère.`; }
  else { cls="r"; msg=`Repas beaucoup trop riche : l'amidon non digéré fermente dans le gros intestin (acidité, acide lactique, risque de coliques et de fourbure). Il faudrait au moins ${need} repas, ou un autre aliment.`; }
  return `<div class="card sim"><div class="eyebrow">Simulation 3</div><h2>Combien d'amidon dans ce repas ?</h2>
    <p class="muted">L'intestin grêle du cheval digère mal l'amidon (céréales). Calculez la quantité apportée par un repas et comparez-la au repère du cours : <strong>100 g d'amidon pour 100 kg de poids vif, par repas, au maximum</strong>.</p>
    <label for="a-pv">Poids du cheval : <span class="num">${fr(a.pv)} kg</span></label><input type="range" id="a-pv" min="200" max="800" step="10" value="${a.pv}" data-amid="pv">
    <label for="a-feed">Aliment</label><select id="a-feed" data-amid="feed">${Object.entries(FEEDS).map(([k,[n,p]])=>`<option value="${k}" ${a.feed===k?"selected":""}>${esc(n)}${p!=null?" · environ "+p+" % d'amidon":""}</option>`).join("")}</select>
    ${a.feed==="perso"?`<label for="a-pct">Taux d'amidon indiqué sur l'étiquette : <span class="num">${fr(a.pct)} %</span></label><input type="range" id="a-pct" min="0" max="70" step="1" value="${a.pct}" data-amid="pct">`:""}
    <label for="a-kg">Quantité par repas : <span class="num">${fr(a.kg,1)} kg</span></label><input type="range" id="a-kg" min="0" max="5" step="0.25" value="${a.kg}" data-amid="kg">
    <div class="out">
      <div class="tile"><div class="v">${fr(gMeal)} g</div><div class="l">d'amidon dans le repas</div></div>
      <div class="tile"><div class="v">${fr(per100)} g</div><div class="l">pour 100 kg de poids vif</div></div>
    </div>
    <div class="gauge" role="img" aria-label="${fr(per100)} grammes pour 100 kilos"><span class="needle" style="left:${pos}%"></span></div>
    <div class="gauge-l"><span>0</span><span>100 · repère du cours</span><span>200</span><span>400 g/100 kg</span></div>
    <div class="verdict ${cls}">${cls==="v"?"✓":cls==="o"?"!":"✕"} ${esc(msg)}</div>
    <p class="small muted">Taux d'amidon indicatifs, qui varient selon les lots : lisez toujours l'étiquette. Dans une étude citée au cours, un repas de 340 g d'amidon pour 100 kg de poids vif a fait baisser le pH du caecum et du côlon vers 6,5 et augmenter fortement l'acide lactique.</p></div>`;
}
function viewSimu(){
  const tabs=[["journee","La journée de l'estomac"],["mast","Mâcher"],["amidon","L'amidon"]];
  return `<div class="card"><div class="eyebrow">Simulations</div><h1>Testez vos décisions de gérant</h1><div class="row">${tabs.map(([k,l])=>`<button class="btn" data-sim="${k}" aria-pressed="${S.sim===k}">${l}</button>`).join("")}</div></div>
    ${S.sim==="mast"?simMast():S.sim==="amidon"?simAmidon():simJournee()}`;
}

/* ---------- Quiz ---------- */
function newQuiz(){ S.quiz={order:shuffle(QUIZ.map((_,i)=>i)), i:0, score:0, ans:null, opts:null}; prepQ(); }
function prepQ(){ const q=QUIZ[S.quiz.order[S.quiz.i]]; S.quiz.opts=shuffle(q.o.map((t,k)=>k)); S.quiz.ans=null; }
function viewQuiz(){
  if(!S.quiz) return `<div class="card"><div class="eyebrow">Quiz</div><h1>${QUIZ.length} questions pour vérifier l'essentiel</h1><p>Questions tirées dans un ordre aléatoire, avec une explication après chaque réponse.</p>${S.best?`<p class="muted">Votre meilleur score sur cet appareil : ${S.best} / ${QUIZ.length}</p>`:""}<div class="row"><button class="btn primary" data-quiz="start">Commencer</button></div></div>`;
  const z=S.quiz;
  if(z.i>=QUIZ.length){ const p=z.score/QUIZ.length;
    return `<div class="card"><div class="eyebrow">Résultat</div><h1>${z.score} / ${QUIZ.length}</h1><p>${p>=0.8?"Très bien : vous avez les bons réflexes de gérant.":p>=0.5?"Pas mal. Revoyez « Le parcours » pour les points manqués.":"Reprenez « Le parcours » étape par étape, puis réessayez."}</p><div class="row"><button class="btn primary" data-quiz="start">Recommencer</button><button class="btn" data-tab="parcours">Revoir le parcours</button></div></div>`; }
  const q=QUIZ[z.order[z.i]];
  return `<div class="card"><div class="row"><div class="eyebrow">Question ${z.i+1} sur ${QUIZ.length}</div><span style="flex:1"></span><span class="muted small">Score : ${z.score}</span></div>
    <div class="prog"><i style="width:${z.i/QUIZ.length*100}%"></i></div>
    <h2>${esc(q.q)}</h2>
    <div style="display:grid;gap:8px">${z.opts.map(k=>{ let c=""; if(z.ans!=null){ if(k===q.a) c="good"; else if(k===z.ans) c="badc"; }
      return `<button class="opt ${c}" data-opt="${k}" ${z.ans!=null?"disabled":""}>${esc(q.o[k])}</button>`; }).join("")}</div>
    ${z.ans!=null?`<div class="verdict ${z.ans===q.a?"v":"r"}">${z.ans===q.a?"✓ Bonne réponse.":"✕ Pas tout à fait."} <span>${esc(q.x)}</span></div><div class="row"><button class="btn primary" data-quiz="next">${z.i<QUIZ.length-1?"Question suivante →":"Voir mon score"}</button></div>`:""}</div>`;
}

/* ======================= RENDU ET ÉVÉNEMENTS ======================= */
function render(){
  renderTabs();
  $("app").innerHTML = S.tab==="simu"?viewSimu():S.tab==="quiz"?viewQuiz():S.tab==="fiches"?viewFiches():viewParcours();
}
function rerenderKeepFocus(id){ render(); const el=$(id); if(el) el.focus(); }
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.tab){ S.tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(d.organ){ S.organ=d.organ; render(); return; }
  if(d.sim){ S.sim=d.sim; render(); return; }
  if(d.tool){ S.tool=d.tool; render(); return; }
  if(d.hour!=null){ const h=+d.hour, x=S.day[h]; if(S.tool==="conc") x.conc=!x.conc; else x.hay=!x.hay; LS.set("rev-day",S.day); render(); return; }
  if(d.preset){ if(d.preset==="box") S.day=defaultDay(); else if(d.preset==="ideal"){ S.day=Array.from({length:24},()=>({hay:true,conc:false})); S.day[7].conc=true; S.day[18].conc=true; } else S.day=Array.from({length:24},()=>({hay:false,conc:false})); LS.set("rev-day",S.day); render(); return; }
  if(d.quiz==="start"){ newQuiz(); render(); return; }
  if(d.quiz==="next"){ S.quiz.i++; if(S.quiz.i<QUIZ.length) prepQ(); else if(S.quiz.score>S.best){ S.best=S.quiz.score; LS.set("rev-best",S.best); } render(); window.scrollTo(0,0); return; }
  if(d.opt!=null && S.quiz && S.quiz.ans==null){ S.quiz.ans=+d.opt; if(S.quiz.ans===QUIZ[S.quiz.order[S.quiz.i]].a) S.quiz.score++; render(); return; }
  if(d.flip!=null){ S.flipped[d.flip]=!S.flipped[d.flip]; render(); return; }
  if(d.flipall!=null){ RECAP.forEach((_,i)=>S.flipped[i]=d.flipall==="1"); render(); return; }
});
document.addEventListener("input",ev=>{
  const el=ev.target, d=el.dataset;
  if(d.mast){ S.mast[d.mast]=+el.value; rerenderKeepFocus(el.id); }
  else if(d.amid){ S.amid[d.amid]= d.amid==="feed"? el.value : +el.value; rerenderKeepFocus(el.id); }
});
render();
</script>
</body>
</html>
